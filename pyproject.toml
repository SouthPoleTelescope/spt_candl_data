[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[project]
name = "spt_candl_data"

readme = "README.rst"

dynamic = ["version", "description"]

# cosEmu (KK emulator) needs these; verified against gpjax 0.13.4 and 0.18.0
dependencies = [
    "jax",
    "gpjax>=0.13",
    "scikit-learn",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

requires-python = ">=3.9"
