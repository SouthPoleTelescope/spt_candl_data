# Minimizer-only re-run (best_of:10). Reuses the converged chain's covmat from the
# same `output:` prefix; sampler is `minimize` so cobaya-run -f keeps these options
# (the --minimize CLI flag would reset best_of to the default of 2).
output: ${DIR_CHAINS}/mnu3_lenscmbbao/data_camb_gmv_spalitetteete_desidr2/chain

theory : !defaults [../configs/theory/withcmb/camb_mnu3]

params : !defaults [../configs/params/withcmb/cosmo_mnu3]

likelihood: !defaults [../configs/likelihoods/lens/withcmb/gmv,
                       ../configs/likelihoods/cmb/spalitetteete,
                       ../configs/likelihoods/bao/desidr2,
                      ]

sampler:
  minimize:
    best_of: 10

prior:
  cal_dip_prior: 'lambda A_act: stats.norm.logpdf(A_act, loc = 1.0, scale = 0.003)'
