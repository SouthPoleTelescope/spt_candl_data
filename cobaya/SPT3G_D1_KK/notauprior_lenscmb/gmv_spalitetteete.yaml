output: ${DIR_CHAINS}/notauprior_lenscmb/data_camb_gmv_spalitetteete_nosroll2/chain

theory : !defaults [../configs/theory/withcmb/camb]

params : !defaults [../configs/params/withcmb/cosmo_base_notauprior]

likelihood: !defaults [../configs/likelihoods/lens/withcmb/gmv,
                       ../configs/likelihoods/cmb/spalitetteete_nosroll2
                      ]

sampler:
  mcmc:
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.05
    learn_proposal: true
    learn_proposal_Rminus1_max_early: 30.0
    learn_proposal_Rminus1_max: 10.0
    drag: true
    proposal_scale: 1.9
    output_every: 1
    oversample_power: 0.4
    max_tries: 10000
    covmat: notauprior_lenscmb/chain.covmat
    # From the converged reference chain
    # notauprior_lenscmb/data_camb_gmvspafg_actplanckbaselens_spalitetteete2
    # (same 15 sampled params; tau block re-adapts via learn_proposal)

prior:
  cal_dip_prior: 'lambda A_act: stats.norm.logpdf(A_act, loc = 1.0, scale = 0.003)'
