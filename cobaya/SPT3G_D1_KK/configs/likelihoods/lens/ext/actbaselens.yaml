# Fixed-cosmology Alens setup per Kimmy: ACT's own lensing-only mode
# (lens_only=True: no norm/N1 correction terms, per Madhavacheril et al. 2024
# App. A), with only the covariance swapped to the non-CMB-marginalized one.
spt_candl_data.act_lensing_wrappers.ACTDR6LensLikeNoCMBmarg:
  lens_only: True
  stop_at_error: true
  lmax: 4000
  variant: act_baseline
