# Profile-hardened GMV with systematics fixed -- for the fixed-cosmology
# A_recon fit of Sec. VII A / Table V.
#
# Tcal_lens / Pcal_lens are pinned to the same values as PP_fixsys (and
# GMV_fixsys), and A_fg is fixed to 0: profile hardening already nulls the
# response to sources matching the assumed profile, matching the paper's
# 'we also evaluate the profile-hardened lensing amplitude setting Afg = 0'.
candl.interface.CandlCobayaLikelihood:
  data_set_file: !!python/name:spt_candl_data.SPT3G_D1_KK ''
  variant: GMVprof_fixsys
  lensing: true
  add_logdet: true
  clear_internal_priors: true
  params:
    Tcal_lens:
      value: 9.989004742e-01
      latex: T_{\rm{cal}}

    Pcal_lens:
      value: 1.007422932e+00
      latex: P_{\rm{cal}}

    beta_pol_90:
      value: 5.356272497452095882e-01
      latex: \beta_{pol}^{90}

    beta_pol_150:
      value: 6.853218816169579508e-01
      latex: \beta_{pol}^{150}

    beta_pol_220:
      value: 6.580057999530474211e-01
      latex: \beta_{pol}^{220}

    beam1:
      value: 0
      latex: \beta_1

    beam2:
      value: 0
      latex: \beta_2

    beam3:
      value: 0 
      latex: \beta_3

    beam4:
      value: 0
      latex: \beta_4

    Atsz:
      value: 0
      latex: A_{\rm tsz}

    Acib150:
      value: 0
      latex: A_{\rm cib}^{150}

    Acib220:
      value: 0 
      latex: A_{\rm cib}^{220}

    Arad90:
      value: 0
      latex: A_{\rm rad}^{90}

    Arad150:
      value: 0 
      latex: A_{\rm rad}^{150}
