planck_2018_lowl.TT: null

act_dr6_cmbonly.PlanckActCut:
  dataset_params:
    use_cl: tt te ee
    lmin_cuts: 0 0 0
    lmax_cuts: 1000 600 600
  params:
    A_planck:
      prior:
        min: 0.5
        max: 1.5
      ref:
        dist: norm
        loc: 1.0
        scale: 0.1
      latex: A_{\rm planck}
      proposal: 0.003

act_dr6_cmbonly.ACTDR6CMBonly:
  input_file: dr6_data_cmbonly.fits
  lmax_theory: 9000
  ell_cuts:
    TT:
    - 600
    - 8500
    TE:
    - 600
    - 8500
    EE:
    - 600
    - 8500
  stop_at_error: true
  params:
    A_act:
      value: 'lambda A_planck: A_planck'
      latex: A_{\rm ACT}
    P_act:
      prior:
        min: 0.9
        max: 1.1
      ref:
        dist: norm
        loc: 1.0
        scale: 0.01
      proposal: 0.01
      latex: p_{\rm ACT}

candl_like:
  additional_args: {}
  clear_internal_priors: true
  data_set_file: !!python/name:spt_candl_data.SPT3G_D1_TnE_lite ''
  external: !!python/name:candl.interface.CandlCobayaLikelihood ''
  feedback: true
  wrapper: null
  params:
    Tcal:
      prior:
        dist: norm
        loc: 1.0000
        scale: 0.0036
      ref: 1.0
      proposal: 0.005
      latex: T_{\rm{cal}}
    Ecal:
      prior:
        max: 1.2
        min: 0.8
      ref: 1.0
      latex: E_{\rm{cal}}
