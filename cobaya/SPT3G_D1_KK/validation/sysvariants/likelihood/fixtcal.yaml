# Fig. 19 systematics/foreground robustness variant of the baseline GMV
# lensing-only run (Sec. VII B).  Tcal fixed to its prior mean; everything else as baseline.
candl.interface.CandlCobayaLikelihood:
  data_set_file: !!python/name:spt_candl_data.SPT3G_D1_KK ''
  variant: GMV
  lensing: true
  add_logdet: true
  clear_internal_priors: true
  params:
    # CMB-SPA (data_camb_spalitetteete2) posterior mean +/- 1sigma
    Tcal_lens:
      value: 0.999107
      latex: T_{\rm{cal}}

    Pcal_lens:
      prior:
        dist: norm
        loc: 1.007472
        scale: 0.004001
      ref: 1.007472
      proposal: 0.002
      latex: P_{\rm{cal}}

    beta_pol_90:
      value: 5.356272497452095882e-01
      latex: \beta_{pol}^{90}

    beta_pol_150:
      value: 6.853218816169579508e-01
      latex: \beta_{pol}^{150}

    beta_pol_220:
      value: 6.580057999530474211e-01
      latex: \beta_{pol}^{220}

    beam1:
      value: 0
      latex: \beta_1

    beam2:
      value: 0
      latex: \beta_2

    beam3:
      value: 0
      latex: \beta_3

    beam4:
      value: 0
      latex: \beta_4

    Atsz:
      prior:
        dist: norm
        loc: 0.9782
        scale: 0.0223
      ref: 0.9782
      proposal: 0.01
      latex: A_{\rm tsz}

    Acib150:
      prior:
        dist: norm
        loc: 0.9732
        scale: 0.0027
      ref: 0.9732
      proposal: 0.001
      latex: A_{\rm cib}^{150}

    Acib220:
      prior:
        dist: norm
        loc: 0.9998
        scale: 0.0024
      ref: 0.9998
      proposal: 0.001
      latex: A_{\rm cib}^{220}

    Arad90:
      prior:
        dist: norm
        loc: 0.963
        scale: 0.0084
      ref: 0.963
      proposal: 0.004
