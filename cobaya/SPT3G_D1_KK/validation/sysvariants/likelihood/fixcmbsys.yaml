# Fig. 19 systematics/foreground robustness variant of the baseline GMV
# lensing-only run (Sec. VII B).  Tcal and Pcal fixed, and the
# CMB-systematics-fixed covariance used in place of the baseline CMBmarg one.
#
# Validation-only: expressed here as a covariance-file override on the public
# GMV data set rather than as a released variant, so nothing extra is exposed by
# spt_candl_data. candl's LensLike applies **kwargs on top of the data set yaml
# ("Overwrite any info in the data set yaml file by passed kwargs"), and
# `additional_args` is the interface's pass-through for that. Verified identical
# to loading a dedicated data set yaml carrying this covariance.
candl.interface.CandlCobayaLikelihood:
  data_set_file: !!python/name:spt_candl_data.SPT3G_D1_KK_GMV ''
  additional_args:
    covariance_file: SPT3G_D1_KK_GMV_cov_CMBmarg_fixsys.txt
  lensing: true
  add_logdet: true
  clear_internal_priors: true
  params:
    # CMB-SPA (data_camb_spalitetteete2) posterior mean +/- 1sigma
    Tcal_lens:
      value: 0.999107
      latex: T_{\rm{cal}}

    Pcal_lens:
      value: 1.007472
      latex: P_{\rm{cal}}

    beta_pol_90:
      value: 5.356272497452095882e-01
      latex: \beta_{pol}^{90}

    beta_pol_150:
      value: 6.853218816169579508e-01
      latex: \beta_{pol}^{150}

    beta_pol_220:
      value: 6.580057999530474211e-01
      latex: \beta_{pol}^{220}

    beam1:
      value: 0
      latex: \beta_1

    beam2:
      value: 0
      latex: \beta_2

    beam3:
      value: 0
      latex: \beta_3

    beam4:
      value: 0
      latex: \beta_4

    Atsz:
      prior:
        dist: norm
        loc: 0.9782
        scale: 0.0223
      ref: 0.9782
      proposal: 0.01
      latex: A_{\rm tsz}

    Acib150:
      prior:
        dist: norm
        loc: 0.9732
        scale: 0.0027
      ref: 0.9732
      proposal: 0.001
      latex: A_{\rm cib}^{150}

    Acib220:
      prior:
        dist: norm
        loc: 0.9998
        scale: 0.0024
      ref: 0.9998
      proposal: 0.001
      latex: A_{\rm cib}^{220}

    Arad90:
      prior:
        dist: norm
        loc: 0.963
        scale: 0.0084
      ref: 0.963
      proposal: 0.004
      latex: A_{\rm rad}^{90}

    Arad150:
      prior:
        dist: norm
        loc: 0.9502
        scale: 0.018
      ref: 0.9502
      proposal: 0.008
      latex: A_{\rm rad}^{150}
