# Lite (fg/sys pre-marginalized) GMV lensing likelihood for joint lensing+CMB
# a2ptarec runs. Mirrors cobaya_files2/data/configs/likelihoods/
# gmvspafglite_nocalprior_a2ptarec_modcamb.yaml.
# Validation-only: points at a local data set yaml in this directory instead of
# a released spt_candl_data variant (nothing added to SPT3G_D1_KK_index.yaml).
# No nuisance params: systematics are pre-marginalized in the lite bandpowers.
candl.interface.CandlCobayaLikelihood:
  data_set_file: /eagle/fieldlevel/repo/crux/spt_candl_data/cobaya/SPT3G_D1_KK/validation/a2ptarec_gmvlite/data/GMV/SPT3G_D1_KK_GMVlite_withcmb.yaml
  lensing: true
  add_logdet: false
  clear_internal_priors: true
