# SPT-3G '20 Lensing (curved-sky Quadratic Estimator GMV) -- lite bandpowers
# Validation-only mirror of the cobaya_files2 gmvspafglite (a2ptarec_modcamb) data set:
# fg/sys pre-marginalized "lite" bandpowers + covariance, so no systematics
# emulator module and no cal/fg nuisance parameters. Joint (withcmb) linear
# response corrections via Mll acting on theory kk/TT/EE/TE.
name: "SPT-3G D1 phiphi lite (Omori et al. 2026)"

band_power_file: SPT3G_D1_KK_GMVlite_bdp.txt
covariance_file: SPT3G_D1_KK_GMVlite_cov.txt

# Location of {spec}_window_functions.txt
window_functions_folder: windows/

# Number of simulation realizations used to compute cov
hartlap_correction:
  N_sims: 498

# Number of bins used
spectra_info:
  - kk: 17

data_model:
  - Module: "spt_candl_data.transformations.KK_transformations.Mll"
    M_matrices_folder: "linear_corrections/"
    Mmodes:
      - kk
      - TT
      - EE
      - TE
    overwrite_ell_max: {"TT": 3500, "TE": 3000, "EE": 3000}
    fiducial_correction_file: "linear_corrections/fiducial_correction.txt"
