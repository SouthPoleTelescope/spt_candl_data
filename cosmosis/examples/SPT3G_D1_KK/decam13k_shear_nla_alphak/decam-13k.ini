intrinsicb-intrinsicb= ngc-ngc:ngc:ngc
verbose = F
get_kernel_peaks = F
sig_over_dchi = 20. 
shear_kernel_dchi = 10.  


[pk_to_cl_sgc]
file = structure/projection/project_2d.py
ell_min_logspaced = 0.1
ell_max_logspaced = 5.0e5
n_ell_logspaced = 100
shear-shear = sgc-sgc:sgc:sgc
shear-intrinsic = sgc-sgc:sgc:sgc
