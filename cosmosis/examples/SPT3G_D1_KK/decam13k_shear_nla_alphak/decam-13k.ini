[2pt_shear_des]
file = shear/cl_to_xi_fullsky/cl_to_xi_interface.py
ell_max = 40000
xi_type = EB
theta_file=%(2PT_FILE_DES)s
bin_avg = T
input_section_name = shear_cl_des  shear_cl_bb_des
output_section_name = shear_xi_plus  shear_xi_minus
e_plus_b_name = des
save_name = des

[2pt_shear_ngc]
