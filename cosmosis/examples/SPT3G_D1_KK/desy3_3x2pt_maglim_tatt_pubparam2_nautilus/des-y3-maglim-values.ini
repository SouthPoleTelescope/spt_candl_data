[cosmological_parameters]
; Sampled in the same fundamental parameters as the official DES Y3 3x2pt chain
; (omega_m, omega_b, A_s directly, omnuh2) rather than this suite's usual
; omch2/ombh2/S_8/mnu. ALL SIX ranges below (omega_m, omega_b, n_s, A_s, h0,
; omnuh2) are copied verbatim from the ## START_OF_VALUES_INI block embedded in
; chain_3x2pt_lcdm_noSR_maglim.txt's header -- i.e. the official chain's own
; bounds, not this suite's. Only h0 and n_s actually differ numerically from
; the pubparam (v1) values; omega_m/omega_b/A_s/omnuh2 already matched.
; num_massive_neutrinos/omega_k/w/wa/nnu/tau are this suite's own consistency-
; module parameter names (the official chain's pipeline uses massive_nu=3,
; massless_nu=0.046, no wa -- equivalent physics, different module/param
; names); left as this suite's fixed defaults since they were already fixed
; (not sampled) in both, so the naming difference has no effect on the prior.
omega_m   = 0.1    0.3                  0.9
omega_b   = 0.03   0.048                0.07
n_s       = 0.87   0.97                 1.07
A_s       = 0.5e-9 2.19e-9              5.0e-9
h0        = 0.55   0.69                 0.91
num_massive_neutrinos = 3
omega_k = 0.0
w       = -1.0
wa      = 0.0
omnuh2  = 0.0006 0.00083 0.00644
nnu     = 3.044
tau     = 0.0697186
[halo_model_parameters]
logt_agn = 7.3  7.8  8.0

[shear_calibration_parameters]
m1 = -0.1  0.0  0.1
m2 = -0.1  0.0  0.1 
m3 = -0.1  0.0  0.1
m4 = -0.1  0.0  0.1

[wl_photoz_errors]
bias_1 = -0.1   0.0   0.1
bias_2 = -0.1   0.0   0.1
bias_3 = -0.1   0.0   0.1
bias_4 = -0.1   0.0   0.1

[lens_photoz_errors]
# maglim: 6 lens bins defined; bins 1-4 sampled, bins 5-6 fixed (dropped by scale cuts)
bias_1 = -0.05  0.0  0.05
bias_2 = -0.05  0.0  0.05
bias_3 = -0.05  0.0  0.05
bias_4 = -0.05  0.0  0.05
bias_5 = 0.0
bias_6 = 0.0
width_1 = 0.1 1.0 1.9
width_2 = 0.1 1.0 1.9
width_3 = 0.1 1.0 1.9
width_4 = 0.1 1.0 1.9
width_5 = 1.0
width_6 = 1.0

[bias_lens]
# maglim: linear bias, b1-b4 sampled, b5-b6 fixed (bins 5-6 dropped by scale cuts)
b1 = 0.8  1.5   3.0
b2 = 0.8  1.8   3.0
b3 = 0.8  1.8   3.0
b4 = 0.8  1.9   3.0
b5 = 2.3
b6 = 2.3

[mag_alpha_lens]
# maglim magnification coefficients (6 bins, all fixed)
alpha_1 = 1.21
alpha_2 = 1.15
alpha_3 = 1.88
alpha_4 = 1.97
alpha_5 = 1.78
alpha_6 = 2.48

[intrinsic_alignment_parameters]
z_piv   =  0.62
A1     = -5.0   0.0  5.0
A2         = -5.0   0.0  5.0
alpha1 = -5.0   0.0  5.0
alpha2     = -5.0   0.0  5.0
bias_ta    = 0.0   1.0  2.0

# NOTE: [candl_nuisance_parameters] intentionally omitted for this DES-only 3x2pt
# (maglim) run -- there is no candl/SPT-lensing module here, so varying
# Tcal/Pcal/Atsz/Acib/Arad would be "varied-but-unused" and break the fast_slow
# split. The GMV run keeps them (desy3_3x2pt_gmv_maglim/des-y3-gmv-maglim-values.ini).
