; HSC Y3 cosmic shear with alpha(k) rescaling of the matter power spectrum.
; Cosmology is fixed to SPA; nuisance parameters and alpha(k) are sampled.
;
; Companion to the smoothed run with the alpha(k) smoothness prior OFF
; (smoothness_sigma = 0.0). Use it as the reference per-bin posterior.
;
; Generated by make_alphak.py from hscy3_shear/hsc-y3-shear-real.ini -- do not hand-edit.
; Everything not listed below is inherited verbatim from that baseline.
;
; Differences from the baseline cosmic-shear run:
;   * cosmology is pinned to the SPA fiducial and logt_agn to 7.8 (see the
;     values file); baryon feedback is degenerate with alpha(k), so leaving it
;     free would just split the same suppression two ways
;   * the 24 alpha bins in [pk_alpha_parameters] are sampled instead
;   * alphak runs straight after camb, so project_2d/cl_to_xi see (1+alpha)P(k)
;   * sampler is nautilus, since 24 extra dimensions with no fast/slow
;     structure is a poor fit for polychord's fast_fraction split
;   * no explicit "likelihoods =" line: that would restrict the total to the
;     named entries and silently drop likelihoods/alphak_smoothness_like

[DEFAULT]
2PT_FILE = likelihood/hsc_cosmic_shear/hsc_y3_fourier_shear.sacc
RUN_NAME = hscy3-shear-real_alphak_nosmooth
; This directory, as seen from the cosmosis run cwd (cosmosis-standard-library).
; Relative paths in an ini resolve against the cwd, not the ini's own location.
KKDIR = ../spt_candl_data/cosmosis/examples/SPT3G_D1_KK
DIR_OUT = ${DIR_CHAIN}/%(RUN_NAME)s/

[pipeline]
; Nautilus has no fast/slow decomposition.
fast_slow = F
values = %(KKDIR)s/hscy3_shear_alphak/hsc-y3-shear-real-values.ini
priors = %(KKDIR)s/hscy3_shear_alphak/hsc-y3-shear-real-priors.ini

modules =
    consistency
    bbn_consistency
    camb
    alphak
    fast_pt
    sacc_nz
    source_photoz_bias
    ia_tatt
    pk_to_cl
    add_intrinsic
    shear_m_bias
    cl_to_xi
    additive_systematics
    2pt_like

extra_output = cosmological_parameters/S_8 cosmological_parameters/sigma_8 cosmological_parameters/A_s cosmological_parameters/omega_m cosmological_parameters/omega_lambda cosmological_parameters/cosmomc_theta
               data_vector/2pt_chi2
               pk_alpha_derived/alpha_lin_0     pk_alpha_derived/alpha_lin_1     pk_alpha_derived/alpha_lin_2     pk_alpha_derived/alpha_lin_3
               pk_alpha_derived/alpha_lin_4     pk_alpha_derived/alpha_lin_5     pk_alpha_derived/alpha_lin_6     pk_alpha_derived/alpha_lin_7
               pk_alpha_derived/alpha_lin_8     pk_alpha_derived/alpha_lin_9     pk_alpha_derived/alpha_lin_10    pk_alpha_derived/alpha_lin_11
               pk_alpha_derived/alpha_lin_12    pk_alpha_derived/alpha_lin_13    pk_alpha_derived/alpha_lin_14    pk_alpha_derived/alpha_lin_15
               pk_alpha_derived/alpha_lin_16    pk_alpha_derived/alpha_lin_17    pk_alpha_derived/alpha_lin_18    pk_alpha_derived/alpha_lin_19
               pk_alpha_derived/alpha_lin_20    pk_alpha_derived/alpha_lin_21    pk_alpha_derived/alpha_lin_22    pk_alpha_derived/alpha_lin_23
timing=F
debug=F

[runtime]
resume = F
sampler = nautilus
verbosity = quiet

[output]
filename = %(DIR_OUT)s/chain_%(RUN_NAME)s_v3.txt
format=text
privacy = F

[multinest]
max_iterations = 20000
multinest_outfile_root = output/hsc-y3-mn-checkpoint
resume = T
tolerance = 0.05
constant_efficiency = F
live_points = 500
efficiency = 0.3
random_seed=1

[test]
fatal_errors=T
save_dir= %(DIR_OUT)s/%(RUN_NAME)s_test

; sampler parameters
[polychord]
base_dir = %(DIR_OUT)s
polychord_outfile_root = poly_%(RUN_NAME)s_v3
resume = F
feedback = 1
fast_fraction = 0.5
live_points = 384
num_repeats = 48
tolerance = 0.1
boost_posteriors = 10.0


[camb]
; alpha(k) is not a CAMB input and cosmology is pinned in the values file,
; so CAMB's output is identical on every sample. cached_camb runs it once
; and replays the snapshot; the real interface is loaded via camb_file.
; Only valid while cosmology stays fixed -- make_alphak.py re-checks the
; values file on every run and falls back to plain camb if it is not.
file = %(KKDIR)s/modules/cached_camb.py
camb_file = boltzmann/camb/camb_interface.py
mode = all
lmax = 2500
feedback = 0
kmin = 1e-5
kmax = 100.0
kmax_extrapolate = 500.0
nk = 700
halofit_version = mead2020_feedback
neutrino_hierarchy = normal
zmid = 2.0
nz_mid = 100
zmax = 6.0
nz = 150
zmax_background = 6.0
zmin_background = 0.0
nz_background = 6000


[bbn_consistency]
file = utility/bbn_consistency/bbn_consistency.py

[consistency]
file = utility/consistency/consistency_interface.py


[sacc_nz]
file = number_density/load_nz_sacc/load_nz_sacc.py
nz_file = %(2PT_FILE)s
data_sets = wl
prefix_extension = T

[source_photoz_bias]
file = number_density/photoz_bias/photoz_bias.py
mode = additive
sample = nz_wl
bias_section = wl_photoz_errors
interpolation = linear

[ia_tatt]
file = intrinsic_alignments/tatt/tatt_interface.py
sub_lowk = F
do_galaxy_intrinsic = F
ia_model = tatt

[fast_pt]
file = structure/fast_pt/fast_pt_interface.py
do_ia = T
k_res_fac = 0.5
verbose = F


[pk_to_cl]
file = structure/projection/project_2d.py
ell_min_logspaced = 0.1
ell_max_logspaced = 5.0e5
n_ell_logspaced = 100
shear-shear = wl-wl
shear-intrinsic = wl-wl
intrinsic-intrinsic = wl-wl
intrinsicb-intrinsicb=wl-wl
verbose = F
get_kernel_peaks = F
sig_over_dchi = 20.
shear_kernel_dchi = 10.



[add_intrinsic]
file=shear/add_intrinsic/add_intrinsic.py
shear-shear=T
perbin=F
position-shear=F

[shear_m_bias]
file = shear/shear_bias/shear_m_bias.py
m_per_bin = True
verbose = F

[cl_to_xi]
file = shear/cl_to_xi_nicaea/nicaea_interface.so
corr_type = 0

[additive_systematics]
file = likelihood/hsc_cosmic_shear/additive_systematic/sys_model.py
nzs = 1
model_type = systematics
theta_min = 3.5
theta_max = 200.
psf_file = likelihood/hsc_cosmic_shear/additive_systematic/systematics.npz
tfile = likelihood/hsc_cosmic_shear/additive_systematic/coorT_cat0.npz


[2pt_like]
file = likelihood/2pt/2pt_like.py
include_norm = F
data_file  = likelihood/hsc_cosmic_shear/hsc_y3_real.fits
data_sets = xi_plus xi_minus
make_covariance = F
covmat_name = COVMAT
covariance_realizations = 1404

angle_range_xi_plus_1_1 = 7.13  56.52
angle_range_xi_plus_1_2 = 7.13  56.52
angle_range_xi_plus_1_3 = 7.13  56.52
angle_range_xi_plus_1_4 = 7.13  56.52
angle_range_xi_plus_2_2 = 7.13  56.52
angle_range_xi_plus_2_3 = 7.13  56.52
angle_range_xi_plus_2_4 = 7.13  56.52
angle_range_xi_plus_3_3 = 7.13  56.52
angle_range_xi_plus_3_4 = 7.13  56.52
angle_range_xi_plus_4_4 = 7.13  56.52

angle_range_xi_minus_1_1 = 31.28 247.75
angle_range_xi_minus_1_2 = 31.28 247.75
angle_range_xi_minus_1_3 = 31.28 247.75
angle_range_xi_minus_1_4 = 31.28 247.75
angle_range_xi_minus_2_2 = 31.28 247.75
angle_range_xi_minus_2_3 = 31.28 247.75
angle_range_xi_minus_2_4 = 31.28 247.75
angle_range_xi_minus_3_3 = 31.28 247.75
angle_range_xi_minus_3_4 = 31.28 247.75
angle_range_xi_minus_4_4 = 31.28 247.75

; Piecewise-linear-in-lnk rescaling P(k,z) -> (1 + alpha(k)) P(k,z), applied to
; the nonlinear spectrum only. Sits directly after camb so every downstream
; consumer of matter_power_nl sees the rescaled spectrum.
;
; smoothness_sigma is left unset, so alphak.py uses its default of 0.3*dlnk
; (dlnk = ln(k_max/k_min)/nk = 0.4797, giving sigma = 0.1439). That is a
; Gaussian penalty on the bin-to-bin differences of alpha, reported as
; likelihoods/alphak_smoothness_like. The _nosmooth companion ini sets
; smoothness_sigma = 0.0 to switch it off.
[alphak]
smoothness_sigma = 0.0
file = %(KKDIR)s/modules/alphak.py
nk = 24
k_min = 1.5e-3
k_max = 1.5e2
apply_to_nl = T
apply_to_lin = F
save_alpha_lin = T
z_pivot = 0.0
extrap = clip
param_section = pk_alpha_parameters
param_prefix = alpha_
derived_section = pk_alpha_derived

[nautilus]
n_live = 2000
resume = T
n_networks = 8
n_batch = 400
f_live = 0.01
n_eff = 20000
filepath = %(DIR_OUT)s/nautilus_%(RUN_NAME)s.hdf5
discard_exploration = True
verbose = True
