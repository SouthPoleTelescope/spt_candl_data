[DEFAULT]
runname=hscy3_shear
DIR_OUT = ${DIR_CHAIN}/%(RUN_NAME)s_nautilus/

[runtime]
sampler = nautilus
verbosity = quiet

[pipeline]
debug=F
; Nautilus has no fast/slow decomposition.
fast_slow = F
first_fast_module = load_nz
values = cosmosis_files/hscy3_shear/fid_values.ini
priors = cosmosis_files/hscy3_shear/fid_priors.ini

modules =
        free_params
        consistency
        bbn_consistency
        geometry
        camb
        ;extrapolate
        ;pklin
        ;pyhalofit16_1par
        extrapolate
        fast_pt
        load_nz
        nzbias
        ia_tatt
        pk2cl
        add_ia
        shear_m_bias
        cl2xi
        add_sys_1z
        2pt_like


extra_output = cosmological_parameters/S_8 cosmological_parameters/sigma_8 cosmological_parameters/A_s cosmological_parameters/omega_m cosmological_parameters/omega_lambda cosmological_parameters/cosmomc_theta
               data_vector/2pt_chi2
quiet=T
debug=F

[output]
filename = %(DIR_OUT)s/chain_%(runname)s.txt
format=text
privacy = F

[test]
fatal_errors=T
save_dir= %(runname)s

[camb]
file = boltzmann/camb/camb_interface.py
mode = all
lmax = 2500
feedback = 0
kmin = 1e-5
kmax = 100.0
nk = 400
halofit_version = mead2020_feedback
neutrino_hierarchy = normal
zmid = 2.0
nz_mid = 100
zmax = 6.0
nz = 150
background_zmax = 6.0
background_zmin = 0.0
background_nz = 6000

[extrapolate]
file = boltzmann/extrapolate/extrapolate_power.py
kmax = 500.


[multinest]
max_iterations = 20000
multinest_outfile_root = checkpoints/multinest_%(runname)s
resume = T
tolerance = 0.05
constant_efficiency = F
live_points = 500
efficiency = 0.3
random_seed=1

[polychord]
max_iterations = 20000
base_dir = ./
polychord_outfile_root = checkpoints/polychord_%(runname)s
resume = F
feedback = 1
fast_fraction = 0.5
live_points = 384
num_repeats = 48
tolerance = 0.1
boost_posteriors = 10.0

[free_params]
file = utils/utility/free_params.py

[bbn_consistency]
file = utility/bbn_consistency/bbn_consistency.py

[consistency]
file = ${cosmosis_dir}/utility/consistency/consistency_interface.py

[geometry]
file = ${cosmosis_dir}/background/astropy_background/astropy_background.py
model = flatwcdm
zmax = 4.
nz = 401

;[pklin]
;file = pklin/pklin_interface.py
;sample_param = A_s
;zmax = 4.0
;kmin = 1e-4
;kmax = 50.0
;nk   = 400

;[pyhalofit16_1par]
;file = pyhalofit/halofit_interface.py
;version = HMcode2016_1par
;verbose = 0

[extrapolate]
file = ${cosmosis_dir}/boltzmann/extrapolate/extrapolate_power.py
kmax = 500.0
nmax = 100

[fast_pt]
file = ${cosmosis_dir}/structure/fast_pt/fast_pt_interface.py
do_ia = T
k_res_fac = 0.5
verbose = F

[ia_tatt]
file = ${cosmosis_dir}/intrinsic_alignments/tatt/tatt_interface.py
sub_lowk = F
do_galaxy_intrinsic = F
ia_model = nla
[add_ia]
file = ${cosmosis_dir}/shear/add_intrinsic/add_intrinsic.py
shear-shear=T
position-shear=F
perbin=F

[load_nz]
file = ${cosmosis_dir}/number_density/load_nz_fits/load_nz_fits.py
nz_file  =  nz/nz.fits
data_sets = sample
prefix_section = T
prefix_extension = T

[nzbias]
file = ${cosmosis_dir}/number_density/photoz_bias/photoz_bias.py
mode = additive
sample = nz_sample
bias_section = nz_sample_errors
interpolation = linear

[pk2cl]
file = ${cosmosis_dir}/structure/projection/project_2d.py
ell_min_logspaced = 0.1
ell_max_logspaced = 5.0e5
n_ell_logspaced = 400
shear-shear = sample-sample
intrinsic-intrinsic = sample-sample
shear-intrinsic = sample-sample
verbose = F
get_kernel_peaks=F

[shear_m_bias]
file = ${cosmosis_dir}/shear/shear_bias/shear_m_bias.py
m_per_bin = True
verbose = F

[cl2xi]
file = ${cosmosis_dir}/shear/cl_to_xi_nicaea/nicaea_interface.so
corr_type = 0

[add_sys_1z]
file = cosmosis_files/hscy3_shear/sys_model.py
nzs = 1
model_type = systematics
theta_min = 3.5
theta_max = 200.
psf_file = cosmosis_files/hscy3_shear/systematics.npz
tfile = cosmosis_files/hscy3_shear/coorT.npz

[2pt_like]
file = ${cosmosis_dir}/likelihood/2pt/2pt_like.py
sellentin= F
include_norm= F
data_file  = data/data_vector.fits
data_sets = xi_plus xi_minus
make_covariance=F
covmat_name=COVMAT
covariance_realizations=1404

angle_range_xi_plus_1_1 = 7.13  56.52
angle_range_xi_plus_1_2 = 7.13  56.52
angle_range_xi_plus_1_3 = 7.13  56.52
angle_range_xi_plus_1_4 = 7.13  56.52
angle_range_xi_plus_2_2 = 7.13  56.52
angle_range_xi_plus_2_3 = 7.13  56.52
angle_range_xi_plus_2_4 = 7.13  56.52
angle_range_xi_plus_3_3 = 7.13  56.52
angle_range_xi_plus_3_4 = 7.13  56.52
angle_range_xi_plus_4_4 = 7.13  56.52

angle_range_xi_minus_1_1 = 31.28 247.75
angle_range_xi_minus_1_2 = 31.28 247.75
angle_range_xi_minus_1_3 = 31.28 247.75
angle_range_xi_minus_1_4 = 31.28 247.75
angle_range_xi_minus_2_2 = 31.28 247.75
angle_range_xi_minus_2_3 = 31.28 247.75
angle_range_xi_minus_2_4 = 31.28 247.75
angle_range_xi_minus_3_3 = 31.28 247.75
angle_range_xi_minus_3_4 = 31.28 247.75
angle_range_xi_minus_4_4 = 31.28 247.75

; nautilus settings (added when this dir was branched from the polychord baseline)
[nautilus]
n_live = 2000
resume = T
n_networks = 8
n_batch = 400
f_live = 0.01
n_eff = 20000
filepath = %(DIR_OUT)s/nautilus_%(RUN_NAME)s.hdf5
discard_exploration = True
verbose = True
