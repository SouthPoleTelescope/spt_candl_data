width_2 = 0.1 1.0 1.9
width_3 = 0.1 1.0 1.9
width_4 = 0.1 1.0 1.9
width_5 = 1.0
width_6 = 1.0

[bias_lens]
# maglim: linear bias, b1-b4 sampled, b5-b6 fixed (bins 5-6 dropped by scale cuts)
b1 = 0.8  1.5   3.0
b2 = 0.8  1.8   3.0
b3 = 0.8  1.8   3.0
b4 = 0.8  1.9   3.0
