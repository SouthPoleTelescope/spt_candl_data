[cosmological_parameters]
# Matched to gmv / the standard chains: amplitude sampled as S_8 (physical
# priors). s8_to_sigma8 converts S_8 -> sigma_8; CAMB (mode=all) then solves A_s
# and computes BOTH the matter power (3x2pt) and the lensing phiphi (GMV).
S_8       = 0.1    0.7567464875805479   1.3
n_s       = 0.84   0.9007697522848085   1.1
ombh2     = 0.019  0.025939374402978773 0.026
omch2     = 0.051  0.11812972217650827  0.255
h0        = 0.40   0.7666550530735352   1.00
num_massive_neutrinos = 3
omega_k = 0.0
w       = -1.0
wa      = 0.0
mnu     = 0.055  0.07740741  0.6
nnu     = 3.044
tau     = 0.0697186

[halo_model_parameters]
logt_agn = 7.3  7.8  8.0

[shear_calibration_parameters]
m1 = -0.1  0.0  0.1
m2 = -0.1  0.0  0.1 
m3 = -0.1  0.0  0.1
m4 = -0.1  0.0  0.1

[wl_photoz_errors]
