[intrinsic_alignment_parameters]
z_piv   =  0.62
A1     = -5.0   0.0  5.0
; NLA: A2 / alpha2 / bias_ta pinned to 0 reduces TATT to 2-parameter NLA (A1, alpha1).
A2      = 0.0
alpha1 = -5.0   0.0  5.0
alpha2  = 0.0
bias_ta = 0.0

