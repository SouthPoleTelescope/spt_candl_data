; Test: compare CAMB-native C_L^pp against the pk_limber_pp (pyccl Limber)
; output at alpha=0 default. pk_limber_pp writes to a diagnostic section
; (cmb_cl_limber) instead of overwriting cmb_cl/pp so both are preserved.

[runtime]
sampler = test
verbosity = quiet

[DEFAULT]
RUN_NAME = gmv_alphak_camb_vs_limber
; This directory, as seen from the cosmosis run cwd (cosmosis-standard-library).
; Relative paths in an ini resolve against the cwd, not the ini's own location.
KKDIR = ../spt_candl_data/cosmosis/examples/SPT3G_D1_KK
DIR_OUT = ${DIR_CHAIN}/%(RUN_NAME)s/

[pipeline]
; Add growth + high_z_power after camb to extend matter_power(z) up to CMB z
; using linear growth (this is the standard cosmosis pattern for CMB lensing).
modules = consistency bbn_consistency camb high_z_power_linear extrapolate alphak clpp_limber
values = %(KKDIR)s/gmv_alphak/gmv-values.ini
priors = %(KKDIR)s/gmv_alphak/gmv-priors.ini
timing = F
debug = F
fast_slow = F


[stop]
file = utility/stop/stop.py

[test]
save_dir = %(DIR_OUT)s/test
fatal_errors = T

[output]
filename = %(DIR_OUT)s/chain_%(RUN_NAME)s.txt
format = text
privacy = F

[consistency]
file = utility/consistency/consistency_interface.py

[bbn_consistency]
file = utility/bbn_consistency/bbn_consistency.py

[extrapolate]
file = boltzmann/extrapolate/extrapolate_power.py
kmax = 500.0
nmax = 100

[camb]
file = boltzmann/camb/camb_interface.py
mode = all
do_tensors = T
do_lensing = T
lmax = 4500
k_eta_fac = 50
lens_margin = 2050
lens_potential_accuracy = 8
lAccuracyBoost = 1.2
min_l_logl_sampling = 6000
AccuracyBoost = 1.1
lSampleBoost = 1.0
NonLinear = both
halofit_version = mead2020_feedback
neutrino_hierarchy = normal
zmin_background = 0.
zmax_background = 6.
nz_background = 6000
n_logz = 100
zmax_logz = 1200.0
kmin = 1e-4
kmax = 50.0
k_per_logint = 130
kmax_extrapolate = 500.0
nk = 700
; matter_power only needs z up to ~6 here; high_z_power extends it via
; linear growth to z~1200 for the CMB-lensing Limber integral.
zmax = 6.0
nz = 150
feedback = 0

[growth]
file = structure/growth_factor/interface.so
zmin = 0.0
zmax = 7.0
dz = 0.02
zmax_log = 1200.0
nz_log = 50

[high_z_power]
file = cosmosis_files/modules/high_z_power/high_z_power.py
sections = matter_power_lin matter_power_nl
zmax = 1200.0
nz = 100

[high_z_power_linear]
file = %(KKDIR)s/modules/high_z_power_linear.py
sections = matter_power_nl matter_power_lin
zmax = 1200.0
nz_log = 100
verbose = T


[alphak]
file = %(KKDIR)s/modules/alphak.py
nk = 24
k_min = 1.5e-3
k_max = 1.5e2
apply_to_nl = T
apply_to_lin = F
save_alpha_lin = F
extrap = clip
param_section = pk_alpha_parameters
param_prefix = alpha_
derived_section = pk_alpha_derived

; cosmosis-side Limber over matter_power_nl (pure python, no pyccl).
; Writes to a diagnostic section so cmb_cl/pp from CAMB survives for comparison.
[clpp_limber]
file = %(KKDIR)s/modules/clpp_limber.py
lmax = 4500
nchi = 20000
kmin = 1e-4
kmax = 50.0
z_cmb = 1089.0
output_section = cmb_cl_limber
output_key = pp
