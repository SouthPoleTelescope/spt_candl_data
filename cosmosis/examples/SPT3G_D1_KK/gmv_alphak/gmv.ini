; SPT-3G GMV CMB-lensing chain with alpha(k) rescaling of the matter
; power spectrum. Cosmology fixed to SPA; candl nuisance + alpha(k) are
; sampled.
;
; Chain for alpha(k) propagation to the SPT-3G likelihood:
;   camb  ->  high_z_power_linear (extends matter_power_{nl,lin} z=6 -> 1200)
;         ->  alphak (modifies matter_power_nl)
;         ->  pk_limber_pp (pyccl Limber, overwrites cmb_cl/pp)
;         ->  spt3g_d1_lensing (candl reads cmb_cl/pp)
;
; Note: cosmosis's own project_2d cmbkappa has a ~12x scale-dependent
; normalization offset vs CAMB native. pk_limber_pp uses pyccl directly,
; verified against CAMB native to ~2% over 100<=L<=3000.
;
; Why high_z_power_linear: CAMB's mead2020_feedback P(k,z) is only
; reliable up to z~5-6; beyond that it flatlines instead of decaying.
; This module appends log(1+z)-spaced z-columns to zmax=1200 using the
; matter-dominated growth law  P(k,z) = P(k,z_break)*[(1+z_break)/(1+z)]^2,
; which is <1% accurate for z>~2 in LCDM.

[runtime]
sampler = nautilus
verbosity = quiet

[DEFAULT]
RUN_NAME = gmv_alphak
; This directory, as seen from the cosmosis run cwd (cosmosis-standard-library).
; Relative paths in an ini resolve against the cwd, not the ini's own location.
KKDIR = ../spt_candl_data/cosmosis/examples/SPT3G_D1_KK
DIR_OUT = ${DIR_CHAIN}/%(RUN_NAME)s/

[pipeline]
modules = consistency bbn_consistency camb high_z_power_linear extrapolate alphak pk_limber_pp spt3g_d1_lensing
; No explicit likelihoods = ... : cosmosis auto-sums any likelihoods/*_like
; entries in the datablock (candl names its entry after the full yaml path).
timing = F
debug = F
priors = %(KKDIR)s/gmv_alphak/gmv-priors.ini
values = %(KKDIR)s/gmv_alphak/gmv-values.ini
extra_output = cosmological_parameters/sigma_8 cosmological_parameters/sigma_12 cosmological_parameters/S_8
               cosmological_parameters/A_s cosmological_parameters/omega_m
               cosmological_parameters/omega_lambda cosmological_parameters/cosmomc_theta
               data_vector/2pt_chi2
               likelihoods/alphak_smoothness_like
               pk_alpha_derived/alpha_lin_0  pk_alpha_derived/alpha_lin_1  pk_alpha_derived/alpha_lin_2  pk_alpha_derived/alpha_lin_3
               pk_alpha_derived/alpha_lin_4  pk_alpha_derived/alpha_lin_5  pk_alpha_derived/alpha_lin_6  pk_alpha_derived/alpha_lin_7
               pk_alpha_derived/alpha_lin_8  pk_alpha_derived/alpha_lin_9  pk_alpha_derived/alpha_lin_10 pk_alpha_derived/alpha_lin_11
               pk_alpha_derived/alpha_lin_12 pk_alpha_derived/alpha_lin_13 pk_alpha_derived/alpha_lin_14 pk_alpha_derived/alpha_lin_15
               pk_alpha_derived/alpha_lin_16 pk_alpha_derived/alpha_lin_17 pk_alpha_derived/alpha_lin_18 pk_alpha_derived/alpha_lin_19
               pk_alpha_derived/alpha_lin_20 pk_alpha_derived/alpha_lin_21 pk_alpha_derived/alpha_lin_22 pk_alpha_derived/alpha_lin_23

fast_slow = F

[output]
filename = %(DIR_OUT)s/chain_%(RUN_NAME)s.txt
format = text
privacy = F

[nautilus]
n_live = 2000
resume = True
n_networks = 8
n_batch = 400
f_live = 0.01
n_eff = 20000
filepath = %(DIR_OUT)s/nautilus_%(RUN_NAME)s.hdf5
discard_exploration = True
verbose = True

[polychord]
base_dir = %(DIR_OUT)s
polychord_outfile_root = poly_%(RUN_NAME)s
resume = F
feedback = 1
fast_fraction = 0.5
live_points = 384
num_repeats = 74
tolerance = 0.1
boost_posteriors = 10.0

[test]
save_dir = %(DIR_OUT)s/%(RUN_NAME)s_test
fatal_errors = T

[consistency]
file = utility/consistency/consistency_interface.py

; Only thing downstream actually uses from CAMB:
;   matter_power_{lin,nl}  (pk_limber_pp)
;   distances/*            (pk_limber_pp + chi_star)
;   cmb_cl/ell             (ell grid; cmb_cl/pp is overwritten by pk_limber_pp)
; Primary-CMB, tensor, lensed CMB, lens-potential accuracy all unused -> drop.
[camb]
file = %(KKDIR)s/modules/cached_camb.py
camb_file = boltzmann/camb/camb_interface.py
mode = all
do_tensors = F
do_lensing = F
lmax = 3100
NonLinear = both
halofit_version = mead2020_feedback
neutrino_hierarchy = normal
zmin_background = 0.
zmax_background = 6.
nz_background = 6000
; log-spaced BACKGROUND extension to z~CMB (distances module only; does NOT
; extend matter_power — high_z_power_linear handles that).
n_logz = 100
zmax_logz = 1200.0
; matter_power z range: stay inside CAMB halofit's reliable regime
; (high_z_power_linear extends from here to z=1200 via linear growth).
zmax = 6.0
nz = 150
kmin = 1e-4
kmax = 50.0
k_per_logint = 130
kmax_extrapolate = 500.0
nk = 700
feedback = 0

[alphak]
file = %(KKDIR)s/modules/alphak.py
nk = 24
k_min = 1.5e-3
k_max = 1.5e2
apply_to_nl = T
apply_to_lin = F
save_alpha_lin = T
z_pivot = 0.0
extrap = clip
param_section = pk_alpha_parameters
param_prefix = alpha_
derived_section = pk_alpha_derived

; pyccl-based Limber of matter_power_nl -> overwrites cmb_cl/pp.
[pk_limber_pp]
file = %(KKDIR)s/modules/pk_limber_pp.py
z_source = 1089.0
ell_min = 2.0
ell_max = 5000.0
n_ell = 1000
output_section = cmb_cl
output_key = pp

[bbn_consistency]
file = utility/bbn_consistency/bbn_consistency.py

[extrapolate]
file = boltzmann/extrapolate/extrapolate_power.py
kmax = 500.0
nmax = 100

; Extends matter_power_{nl,lin} above z_break (CAMB's zmax ~ 6) to zmax=1200
; using matter-dominated linear growth.
[high_z_power_linear]
file = %(KKDIR)s/modules/high_z_power_linear.py
sections = matter_power_nl matter_power_lin
zmax = 1200.0
nz_log = 100
verbose = F

[spt3g_d1_lensing]
file = ./likelihood/candl/candl_cosmosis_interface.py
data_set = ${DIR_CANDLDATA}/1920_PP_v6_GMV_data/config_emu_cmball_gmvfid_nocmb.yaml
lensing = T
feedback = T
clear_1d_internal_priors = T
clear_nd_internal_priors = T
force_ignore_transformations = ''
likelihood_only = F
