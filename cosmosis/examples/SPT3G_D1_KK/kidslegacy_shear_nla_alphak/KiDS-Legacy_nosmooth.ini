; NLA variant -- generated from kidslegacy_shear_alphak_tatt/. Identical to the TATT
; config (newbins data, h0 = 0.40..1.00, nnu = 3.044, no shear ratio) except
; the IA model: ia_model = nla with A2, alpha2, bias_ta pinned to 0.0
; (2-parameter NLA: A1, alpha1 free).
; KiDS-Legacy cosmic shear (COSEBIs) with alpha(k) rescaling of the matter
; power spectrum.
; Cosmology is fixed to SPA; nuisance parameters and alpha(k) are sampled.
;
; Companion to the smoothed run with the alpha(k) smoothness prior OFF
; (smoothness_sigma = 0.0). Use it as the reference per-bin posterior.
;
; Generated by make_alphak.py from kidslegacy_shear/KiDS-Legacy.ini -- do not hand-edit.
; Everything not listed below is inherited verbatim from that baseline.
;
; Differences from the baseline cosmic-shear run:
;   * cosmology is pinned to the SPA fiducial and logt_agn to 7.8 (see the
;     values file); baryon feedback is degenerate with alpha(k), so leaving it
;     free would just split the same suppression two ways
;   * the 24 alpha bins in [pk_alpha_parameters] are sampled instead
;   * alphak runs straight after camb, so project_2d/cl_to_xi see (1+alpha)P(k)
;   * sampler is nautilus, since 24 extra dimensions with no fast/slow
;     structure is a poor fit for polychord's fast_fraction split
;   * no explicit "likelihoods =" line: that would restrict the total to the
;     named entries and silently drop likelihoods/alphak_smoothness_like

[DEFAULT]
DATAFILE=likelihood/KiDS-Legacy/KiDS_Legacy_cosebis.fits
RUN_NAME = KiDS-Legacy_nla_alphak_nosmooth
; This directory, as seen from the cosmosis run cwd (cosmosis-standard-library).
; Relative paths in an ini resolve against the cwd, not the ini's own location.
KKDIR = ../spt_candl_data/cosmosis/examples/SPT3G_D1_KK
DIR_OUT = ${DIR_CHAINS}/%(RUN_NAME)s/

[pipeline]
modules = consistency bbn_consistency correlated_dz_priors load_nz_fits camb alphak source_photoz_bias fast_pt IA projection add_intrinsic cosebis cosebis_like
values = %(KKDIR)s/kidslegacy_shear_nla_alphak/KiDS-Legacy-values.ini
priors = %(KKDIR)s/kidslegacy_shear_nla_alphak/KiDS-Legacy-priors.ini
; No 'likelihoods =' line on purpose: naming the likelihoods explicitly would
; exclude likelihoods/alphak_smoothness_like from the total. With it absent,
; cosmosis sums every likelihoods/*_like entry in the datablock.
extra_output = cosmological_parameters/S_8 cosmological_parameters/sigma_8 cosmological_parameters/A_s cosmological_parameters/omega_m cosmological_parameters/omega_nu cosmological_parameters/omega_lambda cosmological_parameters/cosmomc_theta intrinsic_alignment_parameters/a intrinsic_alignment_parameters/beta intrinsic_alignment_parameters/log10_m_mean_1 intrinsic_alignment_parameters/log10_m_mean_2 intrinsic_alignment_parameters/log10_m_mean_3 intrinsic_alignment_parameters/log10_m_mean_4 intrinsic_alignment_parameters/log10_m_mean_5 intrinsic_alignment_parameters/log10_m_mean_6  nofz_shifts/bias_1 nofz_shifts/bias_2 nofz_shifts/bias_3 nofz_shifts/bias_4 nofz_shifts/bias_5 nofz_shifts/bias_6
               pk_alpha_derived/alpha_lin_0     pk_alpha_derived/alpha_lin_1     pk_alpha_derived/alpha_lin_2     pk_alpha_derived/alpha_lin_3
               pk_alpha_derived/alpha_lin_4     pk_alpha_derived/alpha_lin_5     pk_alpha_derived/alpha_lin_6     pk_alpha_derived/alpha_lin_7
               pk_alpha_derived/alpha_lin_8     pk_alpha_derived/alpha_lin_9     pk_alpha_derived/alpha_lin_10    pk_alpha_derived/alpha_lin_11
               pk_alpha_derived/alpha_lin_12    pk_alpha_derived/alpha_lin_13    pk_alpha_derived/alpha_lin_14    pk_alpha_derived/alpha_lin_15
               pk_alpha_derived/alpha_lin_16    pk_alpha_derived/alpha_lin_17    pk_alpha_derived/alpha_lin_18    pk_alpha_derived/alpha_lin_19
               pk_alpha_derived/alpha_lin_20    pk_alpha_derived/alpha_lin_21    pk_alpha_derived/alpha_lin_22    pk_alpha_derived/alpha_lin_23
verbosity = quiet
timing = F
debug = F
; Nautilus has no fast/slow decomposition.
fast_slow = F

; Default sampler: nautilus
[runtime]
sampler = nautilus

[output]
filename = %(DIR_OUT)s/chain_%(RUN_NAME)s.txt
format = text

[polychord]
base_dir = %(DIR_OUT)s
polychord_outfile_root = poly_%(RUN_NAME)s
resume = F
feedback = 1
fast_fraction = 0.5
live_points = 384
num_repeats = 42
tolerance = 0.1
boost_posteriors = 10.0

; default Nautilus settings for KiDS-Legacy
[nautilus]
live_points = 4000
enlarge_per_dim = 1.1
split_threshold = 100
n_networks = 8
n_batch = 400
filepath = %(DIR_OUT)s/nautilus_%(RUN_NAME)s.hdf5
resume = False
f_live = 0.01
discard_exploration = True
verbose = True
n_eff = 20000

[test]
save_dir = %(DIR_OUT)s/%(RUN_NAME)s_test
fatal_errors=T

; Since CosmoSIS v3, the consistency interface allows for sampling over S8
[bbn_consistency]
file = utility/bbn_consistency/bbn_consistency.py

[consistency]
file = utility/consistency/consistency_interface.py
cosmomc_theta=F
verbose = F

; This module allows for correlated priors for KiDS given a covariance matrix
[correlated_dz_priors]
file = number_density/correlated_priors/correlated_priors.py
uncorrelated_parameters = nofz_shifts/uncorr_bias_1 nofz_shifts/uncorr_bias_2 nofz_shifts/uncorr_bias_3 nofz_shifts/uncorr_bias_4 nofz_shifts/uncorr_bias_5 nofz_shifts/uncorr_bias_6
output_parameters = nofz_shifts/bias_1 nofz_shifts/bias_2 nofz_shifts/bias_3 nofz_shifts/bias_4 nofz_shifts/bias_5 nofz_shifts/bias_6
covariance = likelihood/KiDS-Legacy/Nz_covariance.txt

[load_nz_fits]
file = number_density/load_nz_fits/load_nz_fits.py
nz_file = %(DATAFILE)s
data_sets = source

; use camb for simplicity instead of cosmpower (see https://kids.strw.leidenuniv.nl/sciencedata.php and https://github.com/KiDS-WL/CosmoPowerCosmosis for a pre-trained cosmopower emulator)
[camb]
; alpha(k) is not a CAMB input and cosmology is pinned in the values file,
; so CAMB's output is identical on every sample. cached_camb runs it once
; and replays the snapshot; the real interface is loaded via camb_file.
; Only valid while cosmology stays fixed -- make_alphak.py re-checks the
; values file on every run and falls back to plain camb if it is not.
file = %(KKDIR)s/modules/cached_camb.py
camb_file = boltzmann/camb/camb_interface.py
mode = all
lmax = 2500
feedback = 0
kmin = 1e-5
kmax = 100.0
kmax_extrapolate = 500.0
nk = 700
halofit_version = mead2020_feedback
neutrino_hierarchy = normal
zmid = 2.0
nz_mid = 100
zmax = 6.0
nz = 150
zmax_background = 6.0
zmin_background = 0.0
nz_background = 6000

[source_photoz_bias]
file = number_density/photoz_bias/photoz_bias.py
mode = additive
sample = nz_source
bias_section = nofz_shifts
interpolation = cubic
output_deltaz = T
output_section_name = delta_z_out

; 2-parameter NLA via the TATT interface with A2 = alpha2 = bias_ta = 0, which is
; the same module and the same parameter names used by every other probe here.
; (Verified: ia_model=nla and ia_model=tatt with those pinned give identical
; likelihoods, so 'nla' is used for clarity and to skip the unused TT terms.)
[fast_pt]
file = structure/fast_pt/fast_pt_interface.py
do_ia = T
k_res_fac = 0.5
verbose = F

[IA]
file = intrinsic_alignments/tatt/tatt_interface.py
sub_lowk = F
do_galaxy_intrinsic = F
ia_model = nla
[projection]
file = structure/projection/project_2d.py
ell_min_logspaced = 1.0
ell_max_logspaced = 1.0e5
n_ell_logspaced = 50
position-shear = F
verbose = F
get_kernel_peaks = F
shear-shear = source-source
shear-intrinsic = source-source
intrinsic-intrinsic = source-source

[add_intrinsic]
file = shear/add_intrinsic/add_intrinsic.py
shear-shear = T
position-shear = F
perbin = F

;This calculates COSEBIs from Cls
[cosebis]
file = shear/cosebis/cl_to_cosebis/cl_to_cosebis_interface.so
theta_min = 2.00
theta_max = 300.00
n_max = 6
input_section_name = shear_cl
output_section_name = cosebis

;This is a simplified version of the the KiDS-1000 2pt_likelihood module
[cosebis_like]
file = likelihood/2pt/cosebis/simple_like.py
data_set = En n
data_file = %(DATAFILE)s
like_name = cosebis

; Piecewise-linear-in-lnk rescaling P(k,z) -> (1 + alpha(k)) P(k,z), applied to
; the nonlinear spectrum only. Sits directly after camb so every downstream
; consumer of matter_power_nl sees the rescaled spectrum.
;
; smoothness_sigma is left unset, so alphak.py uses its default of 0.3*dlnk
; (dlnk = ln(k_max/k_min)/nk = 0.4797, giving sigma = 0.1439). That is a
; Gaussian penalty on the bin-to-bin differences of alpha, reported as
; likelihoods/alphak_smoothness_like. The _nosmooth companion ini sets
; smoothness_sigma = 0.0 to switch it off.
[alphak]
smoothness_sigma = 0.0
file = %(KKDIR)s/modules/alphak.py
nk = 24
k_min = 1.5e-3
k_max = 1.5e2
apply_to_nl = T
apply_to_lin = F
save_alpha_lin = T
z_pivot = 0.0
extrap = clip
param_section = pk_alpha_parameters
param_prefix = alpha_
derived_section = pk_alpha_derived
