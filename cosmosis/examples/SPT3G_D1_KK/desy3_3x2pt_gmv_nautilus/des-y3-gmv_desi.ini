; DES Y3 3x2pt + GMV CMB lensing + DESI DR2 BAO
; Based on des-y3-gmv.ini with DESI DR2 BAO likelihood added

[runtime]
sampler = nautilus
verbosity = quiet

[DEFAULT]
2PT_FILE = likelihood/des-y3/2pt_NG_final_2ptunblind_02_24_21_wnz_covupdate.v2.fits
RUN_NAME = desy3_3x2pt_gmv_desi
DIR_OUT = ${DIR_CHAIN}/%(RUN_NAME)s_nautilus/

[pipeline]
modules =  consistency  bbn_consistency
           camb  fast_pt
           fits_nz  lens_photoz_width  lens_photoz_bias  source_photoz_bias
           IA  pk_to_cl_gg  pk_to_cl
           add_magnification  add_intrinsic
           2pt_shear 2pt_gal  2pt_gal_shear
           shear_m_bias   add_point_mass
           desi
           2pt_like spt3g_d1_lensing

timing=F
debug=F
priors = ../spt_candl_data/cosmosis/examples/SPT3G_D1_KK/desy3_3x2pt_gmv/des-y3-gmv-priors.ini
values = ../spt_candl_data/cosmosis/examples/SPT3G_D1_KK/desy3_3x2pt_gmv/des-y3-gmv-values.ini
extra_output = cosmological_parameters/S_8 cosmological_parameters/sigma_8 cosmological_parameters/A_s cosmological_parameters/omega_m cosmological_parameters/omega_lambda cosmological_parameters/cosmomc_theta
               data_vector/2pt_chi2
               likelihoods/desi_bao_like
; Nautilus has no fast/slow decomposition.

fast_slow = F
first_fast_module = shear_m_bias

[polychord]
base_dir = %(DIR_OUT)s
polychord_outfile_root = poly_%(RUN_NAME)s
resume = F
feedback = 1
fast_fraction = 0.5
live_points = 384
num_repeats = 74
tolerance = 0.1
boost_posteriors = 10.0

[output]
filename = %(DIR_OUT)s/chain_%(RUN_NAME)s.txt
format = text
privacy = F

[emcee]
walkers = 80
samples = 10000
nsteps = 5

[star]
nsample_dimension = 20

[test]
save_dir = %(DIR_OUT)s/%(RUN_NAME)s_test
fatal_errors = T

[consistency]
file = utility/consistency/consistency_interface.py
cosmomc_theta = T
verbose = F

[camb]
file = boltzmann/camb/camb_interface.py
mode = all
lmax = 4500
feedback = 0
AccuracyBoost = 1.1
lSampleBoost = 1.0
lAccuracyBoost = 1.0
lens_margin = 1250
lens_potential_accuracy = 4
do_tensors = T
do_lensing = T
NonLinear = both
halofit_version = mead2020_feedback
neutrino_hierarchy = normal
kmax = 100.0
kmax_extrapolate = 500.0
nk = 700
zmin = 0.0
zmax = 6.0
nz = 200
zmin_background = 0.0
zmax_background = 6.0
nz_background = 6000
theta_H0_range = "40 100"
want_chistar = T
n_logz = 100
zmax_logz = 1100.0

[bbn_consistency]
file = utility/bbn_consistency/bbn_consistency.py

[fits_nz]
file = number_density/load_nz_fits/load_nz_fits.py
nz_file = %(2PT_FILE)s
data_sets = lens source
prefix_section = T
prefix_extension = T

[fits_nz_lens]
file = number_density/load_nz_fits/load_nz_fits.py
nz_file = %(2PT_FILE)s
data_sets = lens
prefix_section = T
prefix_extension = T

[lens_photoz_width]
file = number_density/photoz_width/photoz_width.py
mode = stretch
sample = nz_lens
bias_section = lens_photoz_errors
interpolation = linear

[lens_photoz_bias]
file = number_density/photoz_bias/photoz_bias.py
mode = additive
sample = nz_lens
bias_section = lens_photoz_errors
interpolation = linear

[source_photoz_bias]
file = number_density/photoz_bias/photoz_bias.py
mode = additive
sample = nz_source
bias_section = wl_photoz_errors
interpolation = linear

[fast_pt]
file = structure/fast_pt/fast_pt_interface.py
do_ia = T
k_res_fac = 0.5
verbose = F

[IA]
file = intrinsic_alignments/tatt/tatt_interface.py
sub_lowk = F
do_galaxy_intrinsic = F
ia_model = nla
[pk_to_cl_gg]
file = structure/projection/project_2d.py
lingal-lingal = lens-lens
do_exact = lingal-lingal
do_rsd = True
ell_min_linspaced = 1
ell_max_linspaced = 4
n_ell_linspaced = 5
ell_min_logspaced = 5.
ell_max_logspaced = 5.e5
n_ell_logspaced = 80
limber_ell_start = 200
ell_max_logspaced=1.e5
auto_only=lingal-lingal
sig_over_dchi_exact = 3.5

[pk_to_cl]
file = structure/projection/project_2d.py
ell_min_logspaced = 0.1
ell_max_logspaced = 5.0e5
n_ell_logspaced = 100
shear-shear = source-source
shear-intrinsic = source-source
intrinsic-intrinsic = source-source
intrinsicb-intrinsicb=source-source
lingal-shear = lens-source
lingal-intrinsic = lens-source
lingal-magnification = lens-lens
magnification-shear = lens-source
magnification-magnification = lens-lens
magnification-intrinsic = lens-source
verbose = F
get_kernel_peaks = F
sig_over_dchi = 20.
shear_kernel_dchi = 10.

[add_magnification]
file = structure/magnification/add_magnification.py
include_intrinsic=T

[add_intrinsic]
file=shear/add_intrinsic/add_intrinsic.py
shear-shear=T
position-shear=T
perbin=F

[2pt_shear]
file = shear/cl_to_xi_fullsky/cl_to_xi_interface.py
ell_max = 40000
xi_type = EB
theta_file=%(2PT_FILE)s
bin_avg = T
input_section_name = shear_cl  shear_cl_bb
output_section_name = shear_xi_plus  shear_xi_minus

[2pt_gal]
file = shear/cl_to_xi_fullsky/cl_to_xi_interface.py
ell_max = 40000
xi_type='00'
theta_file=%(2PT_FILE)s
bin_avg = T

[2pt_gal_shear]
file = shear/cl_to_xi_fullsky/cl_to_xi_interface.py
ell_max = 40000
xi_type='02'
theta_file=%(2PT_FILE)s
bin_avg = T

[shear_m_bias]
file = shear/shear_bias/shear_m_bias.py
m_per_bin = True
cl_section = shear_xi_plus shear_xi_minus
cross_section = galaxy_shear_xi
verbose = F

[add_point_mass]
file=shear/point_mass/add_gammat_point_mass.py
add_togammat = False
use_fiducial = True
sigcrit_inv_section = sigma_crit_inv_lens_source

[desi]
file = likelihood/bao/desi-dr2/desi_dr2.py
desi_data_sets = all

[2pt_like]
file = likelihood/2pt/2pt_point_mass/2pt_point_mass.py
do_pm_marg = True
do_pm_sigcritinv = True
sigma_a = 10000.0
no_det_fac = False
include_norm = True
data_file = %(2PT_FILE)s
data_sets = xip xim gammat wtheta
make_covariance=F
covmat_name=COVMAT

%include examples/des-y3-scale-cuts.ini

; DISABLED: shear ratios dropped from the analysis; this section is
; kept for reference but shear_ratio_like is not in the module list.
[shear_ratio_like]
file = likelihood/des-y3/shear_ratio/shear_ratio_likelihood.py
data_file = likelihood/des-y3/shear_ratio/2pt_NG_final_2ptunblind_02_24_21_wnz_covupdate_sr.pkl
theta_min_1 = 9.0  6.0  4.5  2.5  2.5
theta_min_2 = 9.0  6.0  4.5  2.5  2.5
theta_min_3 = 2.5  2.5  4.5  2.5  2.5
theta_max = 26.83313651 17.63634989 13.61215672 11.32891161 10.01217238
include_norm = T

[spt3g_d1_lensing]
file = ../spt_candl_data/cosmosis/examples/SPT3G_D1_KK/modules/candl_cosmosis_interface.py
data_set = ${DIR_CANDLDATA}/1920_PP_v6_GMV_data/config_emu_cmball_gmvbhttprf_nocmb.yaml
lensing = T
feedback = T
clear_1d_internal_priors = T
clear_nd_internal_priors = T
force_ignore_transformations = ''
likelihood_only = T

; nautilus settings (added when this dir was branched from the polychord baseline)
[nautilus]
n_live = 2000
resume = T
n_networks = 8
n_batch = 400
f_live = 0.01
n_eff = 20000
filepath = %(DIR_OUT)s/nautilus_%(RUN_NAME)s.hdf5
discard_exploration = True
verbose = True
