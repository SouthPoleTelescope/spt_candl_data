; TATT variant -- generated from desy3_3x2pt_gmv_maglim_nautilus/. Identical to the NLA suite
; (newbins data, h0 = 0.40..1.00, nnu = 3.044, no shear ratio) except the IA
; model: ia_model = tatt with A1, A2, alpha1, alpha2 in [-5,5] and bias_ta in
; [0,2] free (harmonized TATT, same ranges for every probe).
[runtime]
sampler = nautilus
verbosity = quiet

[DEFAULT]
; maglim (newbins) data vector -- 6 lens bins (1-4 used), 4 source bins, 1000x1000 cov
2PT_FILE = likelihood/des-y3/2pt_NG_final_2ptunblind_02_26_21_wnz_maglim_covupdate_newbins.fits
RUN_NAME = desy3_3x2pt_gmv_maglim_tatt
; This directory, as seen from the cosmosis run cwd (cosmosis-standard-library).
; Relative paths in an ini resolve against the cwd, not the ini's own location.
KKDIR = ../spt_candl_data/cosmosis/examples/SPT3G_D1_KK
DIR_OUT = ${DIR_CHAIN}/%(RUN_NAME)s_nautilus/

[pipeline]
modules =  consistency  bbn_consistency
           s8_to_sigma8 camb as_to_log1e10as fast_pt
           fits_nz  lens_photoz_width  lens_photoz_bias  source_photoz_bias
           IA  pk_to_cl_gg  pk_to_cl
           add_magnification  add_intrinsic
           2pt_shear 2pt_gal  2pt_gal_shear
           shear_m_bias   add_point_mass
           2pt_like spt3g_d1_lensing

timing=F
debug=F
priors = %(KKDIR)s/desy3_3x2pt_gmv_maglim_tatt_nautilus/des-y3-gmv-maglim-priors.ini
values = %(KKDIR)s/desy3_3x2pt_gmv_maglim_tatt_nautilus/des-y3-gmv-maglim-values.ini
extra_output = cosmological_parameters/sigma_8 cosmological_parameters/A_s cosmological_parameters/omega_m cosmological_parameters/omega_lambda cosmological_parameters/cosmomc_theta
               data_vector/2pt_chi2

; It's worth switching this to T when sampling using multinest, polychord,
; or other samplers that can take advantage of differences in calculation speeds between
; different parameters.
; Nautilus has no fast/slow decomposition.
fast_slow = F
first_fast_module = shear_m_bias


[polychord]
base_dir = %(DIR_OUT)s
polychord_outfile_root = poly_%(RUN_NAME)s
resume = T
feedback = 1
fast_fraction = 0.1
live_points = 960
num_repeats = 74
tolerance = 0.1
boost_posteriors = 0.0   ; was 10.0 -- retained ~10x phantom points -> ~25GB .resume + multi-hour stalls

[output]
filename = %(DIR_OUT)s/chain_%(RUN_NAME)s.txt
format = text
privacy = F

[emcee]
walkers = 80
samples = 10000
nsteps = 5


; This sampler makes a 1D likelihood slice in each dimension
; It's handy for doing a thorough comparison to other codes
[star]
nsample_dimension = 20

[test]
save_dir = %(DIR_OUT)s/%(RUN_NAME)s_test
fatal_errors = T


[consistency]
file = utility/consistency/consistency_interface.py
; sampling h0 directly now (not cosmomc_theta), so leave this off
;cosmomc_theta = T
verbose = F

[s8_to_sigma8]
; convert sampled S_8 -> sigma_8 so CAMB solves A_s (computes matter power + phiphi)
file = %(KKDIR)s/modules/s8_to_sigma8.py

[as_to_log1e10as]
; expose log1e10As from the A_s CAMB solved for (candl interface requires logA)
file = %(KKDIR)s/modules/as_to_log1e10as.py


[camb]
; plain camb (no fork wrapper: forking per-eval deadlocks with JAX/candl which is
; multithreaded). Extreme-cosmology camb hangs are avoided by the tightened priors.
; mode=all -> matter power (3x2pt) AND lensing phiphi (GMV).
file = boltzmann/camb/camb_interface.py
mode = all
lmax = 4500
feedback = 0
AccuracyBoost = 1.1
lSampleBoost = 1.0
lAccuracyBoost = 1.0
lens_margin = 1250
lens_potential_accuracy = 4
do_tensors = T
do_lensing = T
NonLinear = both
halofit_version = mead2020_feedback
neutrino_hierarchy = normal
kmax = 100.0
kmax_extrapolate = 500.0
nk = 700
zmin = 0.0
zmax = 6.0
nz = 200
zmin_background = 0.0
zmax_background = 6.0
nz_background = 6000
theta_H0_range = "40 100"
want_chistar = T
n_logz = 100
zmax_logz = 1100.0


[camb_planck]
file = boltzmann/camb/camb.so
mode=all
lmax=3000

feedback=0
do_tensors=T
do_lensing=T
do_nonlinear=T
high_ell_template=$COSMOSIS_SRC_DIR/boltzmann/camb/camb_Jan15/HighLExtrapTemplate_lenspotentialCls.dat

; because we will be using the Planck likelihood we also need to set the
; accuracy to higher values. This makes a big difference to the likelihood values (delta log L ~ 36)
accuracy_boost=1.1  ;CAMB accuracy boost parameter
high_accuracy_default=T

; set these if you are doing lensing:
; lmax = 4500
; max_eta_k = 500000
; use_nonlinear_lensing = T


[bbn_consistency]
file = utility/bbn_consistency/bbn_consistency.py

[fits_nz]
file = number_density/load_nz_fits/load_nz_fits.py
nz_file = %(2PT_FILE)s
data_sets = lens source
prefix_section = T
prefix_extension = T

[fits_nz_lens]
file = number_density/load_nz_fits/load_nz_fits.py
nz_file = %(2PT_FILE)s
data_sets = lens
prefix_section = T
prefix_extension = T

[lens_photoz_width]
file = number_density/photoz_width/photoz_width.py
mode = stretch
sample = nz_lens
bias_section = lens_photoz_errors
interpolation = linear

[lens_photoz_bias]
file = number_density/photoz_bias/photoz_bias.py
mode = additive
sample = nz_lens
bias_section = lens_photoz_errors
interpolation = linear

; hyperrank and source_photoz_bias are exclusive
[hyperrank]
file = number_density/nz_multirank/nz_multirank.py
nz_file = %(2PT_FILE)s
data_set = source
dimensions = 3
bin_ranks= 1 2 4 

[source_photoz_bias]
file = number_density/photoz_bias/photoz_bias.py
mode = additive
sample = nz_source
bias_section = wl_photoz_errors
interpolation = linear

[fast_pt]
file = structure/fast_pt/fast_pt_interface.py
do_ia = T
k_res_fac = 0.5
verbose = F

[IA]
file = intrinsic_alignments/tatt/tatt_interface.py
sub_lowk = F
do_galaxy_intrinsic = F
ia_model = tatt
[pk_to_cl_gg]
file = structure/projection/project_2d.py
lingal-lingal = lens-lens
do_exact = lingal-lingal
do_rsd = True
ell_min_linspaced = 1
ell_max_linspaced = 4
n_ell_linspaced = 5
ell_min_logspaced = 5.
ell_max_logspaced = 5.e5
n_ell_logspaced = 80
limber_ell_start = 200
ell_max_logspaced=1.e5
auto_only=lingal-lingal
sig_over_dchi_exact = 3.5

[pk_to_cl]
file = structure/projection/project_2d.py
ell_min_logspaced = 0.1
ell_max_logspaced = 5.0e5
n_ell_logspaced = 100 
shear-shear = source-source
shear-intrinsic = source-source
intrinsic-intrinsic = source-source
intrinsicb-intrinsicb=source-source
lingal-shear = lens-source
lingal-intrinsic = lens-source
lingal-magnification = lens-lens
magnification-shear = lens-source
magnification-magnification = lens-lens
magnification-intrinsic = lens-source 
verbose = F
get_kernel_peaks = F
sig_over_dchi = 20. 
shear_kernel_dchi = 10. 

[add_magnification]
file = structure/magnification/add_magnification.py
include_intrinsic=T

[add_intrinsic]
file=shear/add_intrinsic/add_intrinsic.py
shear-shear=T
position-shear=T
perbin=F

[add_eb]
file = intrinsic_alignments/add_b_mode/add_b_mode_cl.py

[2pt_shear]
file = shear/cl_to_xi_fullsky/cl_to_xi_interface.py
ell_max = 40000
xi_type = EB
theta_file=%(2PT_FILE)s
bin_avg = T
; these get
input_section_name = shear_cl  shear_cl_bb
output_section_name = shear_xi_plus  shear_xi_minus

[2pt_gal]
file = shear/cl_to_xi_fullsky/cl_to_xi_interface.py
ell_max = 40000
xi_type='00'
theta_file=%(2PT_FILE)s
bin_avg = T

[2pt_gal_shear]
file = shear/cl_to_xi_fullsky/cl_to_xi_interface.py
ell_max = 40000
xi_type='02'
theta_file=%(2PT_FILE)s
bin_avg = T

[shear_m_bias]
file = shear/shear_bias/shear_m_bias.py
m_per_bin = True
; Despite the parameter name, this can operate on xi as well as C_ell.
cl_section = shear_xi_plus shear_xi_minus
cross_section = galaxy_shear_xi
verbose = F

[add_point_mass]
file=shear/point_mass/add_gammat_point_mass.py
add_togammat = False
use_fiducial = True
sigcrit_inv_section = sigma_crit_inv_lens_source

[2pt_like]
file = likelihood/2pt/2pt_point_mass/2pt_point_mass.py
do_pm_marg = True
do_pm_sigcritinv = True
sigma_a = 10000.0
no_det_fac = False
include_norm = True
data_file = %(2PT_FILE)s
data_sets = xip xim gammat wtheta
make_covariance=F
covmat_name=COVMAT

; we put these in a separate file because they are long (maglim 4-lens-bin cuts)
%include examples/des-y3-maglim-scale-cuts.ini


; The small-scale galaxy galaxy-lensing correlations have uncertain
; enough modelling that we can't use them directly, but the ratio between
; sets of correlations can be used, since it only depends on geometry
; DISABLED: shear ratios dropped from the analysis; this section is
; kept for reference but shear_ratio_like is not in the module list.
[shear_ratio_like]
file = likelihood/des-y3/shear_ratio/shear_ratio_likelihood.py
; maglim shear-ratio (6 lens-bin theta arrays); no newbins-specific sr file exists and
; newbins shares maglim's tomographic binning, so the standard maglim sr.pkl applies.
data_file = likelihood/des-y3/shear_ratio/2pt_NG_final_2ptunblind_02_26_21_wnz_maglim_covupdate_sr.pkl
theta_min_1 = 8.47 6.07 4.34 2.5 2.5 2.5
theta_min_2 = 8.47 6.07 4.34 2.5 2.5 2.5
theta_min_3 = 2.5 2.5 4.34 2.5 2.5 2.5
theta_max = 25.4 18.26 13.03 10.87 9.66 9.04
include_norm = T


;;;;;;;;;;EXTERNAL LIKELIHOODS;;;;;;;;;;

; These external likelihoods can be enabled by adding the name
; of the section to the list of modules above.
; Note that many of the Planck modules should be mutually exclusive
; and also that if you switch on planck lensing you should uncomment
; some parameters in the [camb] section above

;;CMB;;
[p-TTTEEE-lowE]
;Planck 2018 high ell TT,TE and EE + low ell TT + low ell EE (in Planck notations = TT+lowE)
;without CMB lensing
file = likelihood/planck2018/planck_interface.so
;high ell TT,TE and EE
data_1 = ${PLANCKPATH}/hi_l/plik/plik_rd12_HM_v22b_TTTEEE.clik
;low ell TT
data_2 = ${PLANCKPATH}/low_l/commander/commander_dx12_v3_2_29.clik
;low ell EE 
data_3 = ${PLANCKPATH}/low_l/simall/simall_100x143_offlike5_EE_Aplanck_B.clik

[p-TTTEEE_lite-lowE]
;Planck 2018 high ell TT,TE and EE + low ell TT + low ell EE (in Planck notations = TT+lowE)
;without CMB lensing
file = likelihood/planck2018/planck_interface.so
;high ell TT,TE and EE lite
data_1 = ${PLANCKPATH}/hi_l/plik_lite/plik_lite_v22_TTTEEE.clik
;low ell TT
data_2 = ${PLANCKPATH}/low_l/commander/commander_dx12_v3_2_29.clik
;low ell EE 
data_3 = ${PLANCKPATH}/low_l/simall/simall_100x143_offlike5_EE_Aplanck_B.clik

[p-TTTEEE-lowE-lensing]
;Planck 2018 high ell TT,TE and EE + low ell TT + low ell EE (in Planck notations = TT+lowE)
;with CMB lensing
file = likelihood/planck2018/planck_interface.so
;high ell TT,TE and EE
data_1 = ${PLANCKPATH}/hi_l/plik/plik_rd12_HM_v22b_TTTEEE.clik
;low ell TT
data_2 = ${PLANCKPATH}/low_l/commander/commander_dx12_v3_2_29.clik
;low ell EE 
data_3 = ${PLANCKPATH}/low_l/simall/simall_100x143_offlike5_EE_Aplanck_B.clik
;lensing
lensing_1 = ${PLANCKPATH}/lensing/smicadx12_Dec5_ftl_mv2_ndclpp_p_teb_consext8.clik_lensing

[p-TTTEEE_lite-lensing]
;Planck 2018 high ell TT,TE and EE + low ell TT + low ell EE (in Planck notations = TT+lowE)
;without CMB lensing
file = likelihood/planck2018/planck_interface.so
;high ell TT,TE and EE lite
data_1 = ${PLANCKPATH}/hi_l/plik_lite/plik_lite_v22_TTTEEE.clik
;lensing
lensing_1 = ${PLANCKPATH}/lensing/smicadx12_Dec5_ftl_mv2_ndclpp_p_teb_consext8.clik_lensing

[p-TTTEEE_lite-lowE-lensing]
;Planck 2018 high ell TT,TE and EE + low ell TT + low ell EE (in Planck notations = TT+lowE)
;without CMB lensing
file = likelihood/planck2018/planck_interface.so
;high ell TT,TE and EE lite
data_1 = ${PLANCKPATH}/hi_l/plik_lite/plik_lite_v22_TTTEEE.clik
;low ell TT
data_2 = ${PLANCKPATH}/low_l/commander/commander_dx12_v3_2_29.clik
;low ell EE 
data_3 = ${PLANCKPATH}/low_l/simall/simall_100x143_offlike5_EE_Aplanck_B.clik
;lensing
lensing_1 = ${PLANCKPATH}/lensing/smicadx12_Dec5_ftl_mv2_ndclpp_p_teb_consext8.clik_lensing

[p-lensing]
;Planck 2018 CMB lensing
file = likelihood/planck2018/planck_interface.so
;lensing
lensing_1 = ${PLANCKPATH}/lensing/smicadx12_Dec5_ftl_mv2_ndclpp_p_teb_consext8_CMBmarged.clik_lensing

;;BAO;;
[6dfgs]
file = likelihood/6dfgs/6dfgs.py
;6dfgs measurement of r_s/D_v (if you want to use only D_v, set bao_mode to dv).
bao_mode = "rs_dv"

[mgs_bao]
file = likelihood/mgs_bao/mgs_bao.py

[bossdr12_gal]
file = likelihood/boss_dr12/boss_dr12.py
;set to 0 for BAO only, to 1 for BAOxf*sigma8
mode = 0
feedback = 0

#BOSS DR12 likelihood, reanalyzed by eboss dr16 and where highest redshift bin is removed
# !! This module (not the one above) 
# should be used when using bossdr12 with ebossdr16 !!
[bossdr12_reanalyze]
file = likelihood/eboss_dr16/boss_dr12/boss_dr12_lrg_reanalyze.py
mode = 0
feedback = F

;!!!!!!
;DESY3 BAO is for now simulated. 
;!!!!!!
[bao_desy3]
;simulated version of DES Y3 BAO 
file = cosmosis-des-library/lss/bao_y3_like/bao_y3_like.py

[bao_desy1]
file = cosmosis-des-library/lss/bao_y1_like/bao_y1_like.py

;!!!!!!
;eboss dr16  
;!!!!!!
[eboss16_lrg]
file = likelihood/eboss_dr16/lrg/eboss_dr16_lrg.py
mode = 0
feedback = F

[eboss16_elg]
file = likelihood/eboss_dr16/elg/eboss_dr16_elg.py
mode = 0
feedback = F

[eboss16_qso]
file = likelihood/eboss_dr16/qso/eboss_dr16_qso.py
mode = 0
feedback = F

[eboss16_lya]
file = likelihood/eboss_dr16/lya/eboss_dr16_lya.py
feedback = F

;;SN;;
[pantheon]
file = likelihood/pantheon/pantheon.py

[riess16]
file = likelihood/riess16/riess16.py

[des_sne]
file = ${COSMOSIS_SRC_DIR}/likelihood/pantheon/pantheon.py
data_file = ../data/Y1_DESSN_ONLY_COSMOSIS_FILES/lcparam_DESONLY_V8_0.txt
covmat_file = ../data/Y1_DESSN_ONLY_COSMOSIS_FILES/sys_DESONLY_V8_AVG_0.txt

;;RSD;;
[6dfgs_baorsd]
file = external/bao/6dfgs/6dfgs.py
rsd_like = T 

[mgs_baorsd]
file = likelihood/eboss_dr16/mgs/mgs.py

[bossdr12_reanalyze_baorsd]
