mode = 1
feedback = F

[bbn]
file = likelihood/bbn/bbn_ombh2_pitrou20_cooke18/bbn_ombh2_pitrou20_cooke18.py 



; This can be used to simulate a data vector from a pipeline
[save_2pt]
file = likelihood/2pt/save_2pt.py
theta_min = 2.5
theta_max = 250.0
n_theta = 20
real_space = T
make_covariance = F
shear_nz_name = nz_source
position_nz_name = nz_lens
filename = output/sim_y3.fits
overwrite = T
auto_only = galaxy_xi
;cut_wtheta = 1,2 1,3 2,3 1,4 2,4 3,4 1,5 2,5 3,5 4,5
spectrum_sections = shear_xi_plus shear_xi_minus galaxy_shear_xi galaxy_xi
output_extensions = xip xim gammat wtheta
two_thirds_midpoint = T
copy_covariance=data_vectors/${DATAFILE}


[spt3g_d1_lensing]
file = ./likelihood/candl/candl_cosmosis_interface.py 
data_set = spt_candl_data.SPT3G_D1_KK   ; package shortcut -> SPT3G_D1_KK_v0/SPT3G_D1_KK_index.yaml
variant  = GMV                          ; lensing-only, CMB-marginalized cov (== old gmvfid_nocmb)
lensing = T ; Switch on for lensing likelihoods
feedback = T ; Switch on to request feedback from candl initialisation
;data_selection = "..." ; Select a subset of the data set
clear_1d_internal_priors = T ; Switch off to use candl internal 1d priors
clear_nd_internal_priors = T ; Switch on to ignore candl internal higher dimensional priors. Careful: higher-dimensional priors are not implemented in CosmoSIS itself.
force_ignore_transformations = '' ; Backdoor if you want to ignore certain transformations in the data model.
likelihood_only = F ; must be F: candl interface returns a jax array under T, which cosmosis cannot store

; nautilus settings (added when this dir was branched from the polychord baseline)
[nautilus]
n_live = 2000
resume = T
n_networks = 8
n_batch = 400
f_live = 0.01
n_eff = 20000
filepath = %(DIR_OUT)s/nautilus_%(RUN_NAME)s.hdf5
discard_exploration = True
verbose = True
