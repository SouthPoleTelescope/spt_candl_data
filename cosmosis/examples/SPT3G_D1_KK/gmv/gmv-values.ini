[cosmological_parameters]
# Cosmology priors matched to the standard chains (physical ranges). The previous
# ultra-wide ranges (omch2 up to 0.99, h0 down to 0.40) let PolyChord draw extreme
# Omega_m cosmologies on which camb hangs, deadlocking fresh live-point generation.
# Amplitude is sampled as S_8 (matches the other cosmosis chains); the s8_to_sigma8
# module converts it to sigma_8, and CAMB solves A_s internally and computes phiphi.
S_8       = 0.1    0.7567464875805479   1.3
n_s       = 0.84   0.9007697522848085   1.1
ombh2     = 0.019  0.025939374402978773 0.026
omch2     = 0.051  0.11812972217650827  0.255
h0        = 0.64   0.7666550530735352   0.82
num_massive_neutrinos = 3
omega_k = 0.0
w       = -1.0
wa      = 0.0
mnu     = 0.055  0.07740741  0.6
nnu     = 3.046
tau     = 0.0697186

[halo_model_parameters]
logt_agn = 7.3  7.8  8.0

# (shear / wl_photoz / lens_photoz / bias_lens / mag_alpha / IA sections removed:
#  the lensing-only gmv pipeline never reads them -- they only bloated the sampling.)

