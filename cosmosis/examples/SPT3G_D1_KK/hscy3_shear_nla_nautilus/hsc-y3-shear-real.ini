; NLA variant -- generated from hscy3_shear_tatt_nautilus/. Identical to the TATT
; config (newbins data, h0 = 0.40..1.00, nnu = 3.044, no shear ratio) except
; the IA model: ia_model = nla with A2, alpha2, bias_ta pinned to 0.0
; (2-parameter NLA: A1, alpha1 free).
; This is an example using the HSC Year 3 cosmic shear data.
; It is based on Dalal et al, but that work used the power spectrum
; the power spectrum from the linear BACCO emulator and pyhmcode2016, the
; interfaces for which are not public immediately. Results may be slightly
; different, but S_8 constraints should match well.

[DEFAULT]
2PT_FILE = likelihood/hsc_cosmic_shear/hsc_y3_fourier_shear.sacc
RUN_NAME = hscy3-shear-real_nla
DIR_OUT = ${DIR_CHAIN}/%(RUN_NAME)s_nautilus/

[pipeline]
; Nautilus has no fast/slow decomposition.
fast_slow = F
first_fast_module = sacc_nz
values = ../spt_candl_data/cosmosis/examples/SPT3G_D1_KK/hscy3_shear_nla_nautilus/hsc-y3-shear-real-values.ini
priors = ../spt_candl_data/cosmosis/examples/SPT3G_D1_KK/hscy3_shear_nla_nautilus/hsc-y3-shear-real-priors.ini

modules =
    consistency
    bbn_consistency
    camb
    fast_pt
    sacc_nz
    source_photoz_bias
    ia_tatt
    pk_to_cl
    add_intrinsic
    shear_m_bias
    cl_to_xi
    additive_systematics
    2pt_like

extra_output = cosmological_parameters/S_8 cosmological_parameters/sigma_8 cosmological_parameters/A_s cosmological_parameters/omega_m cosmological_parameters/omega_lambda cosmological_parameters/cosmomc_theta
               data_vector/2pt_chi2
timing=F
debug=F

[runtime]
resume = F
sampler = nautilus
verbosity = quiet

[output]
filename = %(DIR_OUT)s/chain_%(RUN_NAME)s.txt
format=text
privacy = F

[multinest]
max_iterations = 20000
multinest_outfile_root = output/hsc-y3-mn-checkpoint
resume = T
tolerance = 0.05
constant_efficiency = F
live_points = 500
efficiency = 0.3
random_seed=1

[test]
fatal_errors=T
save_dir= %(DIR_OUT)s/%(RUN_NAME)s_test

; sampler parameters
[polychord]
base_dir = %(DIR_OUT)s
polychord_outfile_root = poly_%(RUN_NAME)s
resume = F
feedback = 1
fast_fraction = 0.5
live_points = 384
num_repeats = 48
tolerance = 0.1
boost_posteriors = 10.0


[nautilus]
n_live = 2000
resume = True

[camb]
file = boltzmann/camb/camb_interface.py
mode = all
lmax = 2500
feedback = 0
kmin = 1e-5
kmax = 100.0
kmax_extrapolate = 500.0
nk = 700
halofit_version = mead2020_feedback
neutrino_hierarchy = normal
zmid = 2.0
nz_mid = 100
zmax = 6.0
nz = 150
zmax_background = 6.0
zmin_background = 0.0
nz_background = 6000


[bbn_consistency]
file = utility/bbn_consistency/bbn_consistency.py

[consistency]
file = utility/consistency/consistency_interface.py


[sacc_nz]
file = number_density/load_nz_sacc/load_nz_sacc.py
nz_file = %(2PT_FILE)s
data_sets = wl
prefix_extension = T

[source_photoz_bias]
file = number_density/photoz_bias/photoz_bias.py
mode = additive
sample = nz_wl
bias_section = wl_photoz_errors
interpolation = linear

[ia_tatt]
file = intrinsic_alignments/tatt/tatt_interface.py
sub_lowk = F
do_galaxy_intrinsic = F
ia_model = nla
[fast_pt]
file = structure/fast_pt/fast_pt_interface.py
do_ia = T
k_res_fac = 0.5
verbose = F


[pk_to_cl]
file = structure/projection/project_2d.py
ell_min_logspaced = 0.1
ell_max_logspaced = 5.0e5
n_ell_logspaced = 100
shear-shear = wl-wl
shear-intrinsic = wl-wl
intrinsic-intrinsic = wl-wl
intrinsicb-intrinsicb=wl-wl
verbose = F
get_kernel_peaks = F
sig_over_dchi = 20.
shear_kernel_dchi = 10.



[add_intrinsic]
file=shear/add_intrinsic/add_intrinsic.py
shear-shear=T
perbin=F
position-shear=F

[shear_m_bias]
file = shear/shear_bias/shear_m_bias.py
m_per_bin = True
verbose = F

[cl_to_xi]
file = shear/cl_to_xi_nicaea/nicaea_interface.so
corr_type = 0

[additive_systematics]
file = likelihood/hsc_cosmic_shear/additive_systematic/sys_model.py
nzs = 1
model_type = systematics
theta_min = 3.5
theta_max = 200.
psf_file = likelihood/hsc_cosmic_shear/additive_systematic/systematics.npz
tfile = likelihood/hsc_cosmic_shear/additive_systematic/coorT_cat0.npz


[2pt_like]
file = likelihood/2pt/2pt_like.py
include_norm = F
data_file  = likelihood/hsc_cosmic_shear/hsc_y3_real.fits
data_sets = xi_plus xi_minus
make_covariance = F
covmat_name = COVMAT
covariance_realizations = 1404

angle_range_xi_plus_1_1 = 7.13  56.52
angle_range_xi_plus_1_2 = 7.13  56.52
angle_range_xi_plus_1_3 = 7.13  56.52
angle_range_xi_plus_1_4 = 7.13  56.52
angle_range_xi_plus_2_2 = 7.13  56.52
angle_range_xi_plus_2_3 = 7.13  56.52
angle_range_xi_plus_2_4 = 7.13  56.52
angle_range_xi_plus_3_3 = 7.13  56.52
angle_range_xi_plus_3_4 = 7.13  56.52
angle_range_xi_plus_4_4 = 7.13  56.52

angle_range_xi_minus_1_1 = 31.28 247.75
angle_range_xi_minus_1_2 = 31.28 247.75
angle_range_xi_minus_1_3 = 31.28 247.75
angle_range_xi_minus_1_4 = 31.28 247.75
angle_range_xi_minus_2_2 = 31.28 247.75
angle_range_xi_minus_2_3 = 31.28 247.75
angle_range_xi_minus_2_4 = 31.28 247.75
angle_range_xi_minus_3_3 = 31.28 247.75
angle_range_xi_minus_3_4 = 31.28 247.75
angle_range_xi_minus_4_4 = 31.28 247.75
